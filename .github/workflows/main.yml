name: Deploy to EKS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-fastapi-repo
  EKS_CLUSTER: my-eks-cluster  # 👈 여기만 '진짜' 이름인지 다시 확인!

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}      # 새 이름으로 변경!
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # 새 이름으로 변경!
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Deploy to EKS
        run: |
          # 1. k8s/ 제거 (현재 폴더에 있는 deployment.yaml을 직접 수정)
          sed -i "s|CONTAINER_IMAGE|${{ steps.build-image.outputs.image }}|g" deployment.yaml
          
          # 2. k8s/ 제거 (현재 폴더의 매니페스트 적용)
          kubectl apply -f deployment.yaml
